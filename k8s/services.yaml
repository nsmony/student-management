# Public entry point: ONLY the API gateway is exposed
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-registration
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
# Internal service for the search pod (reached by the gateway)
apiVersion: v1
kind: Service
metadata:
  name: search-service
spec:
  type: ClusterIP
  selector:
    app: search
  ports:
    - port: 8082
      targetPort: 8082
